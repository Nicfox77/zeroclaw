[package]
name = "zeroclaw-session-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true
description = "Native session family composition shared by application hosts"

[dependencies]
zeroclaw-api.workspace = true
zeroclaw-config.workspace = true
zeroclaw-infra.workspace = true
zeroclaw-kernel.workspace = true
zeroclaw-providers.workspace = true
serde_json = "1.0"
tokio = { version = "1.50", default-features = false, features = ["rt", "sync"] }
async-trait = "0.1"
anyhow = "1.0"
futures-util = "0.3"

[dev-dependencies]
tokio-util = { version = "0.7", default-features = false }
tokio = { version = "1.50", features = ["macros", "test-util", "time"] }
zeroclaw-infra = { workspace = true, features = ["test-util"] }
tempfile = "3.26"
